<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="zenithBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1b69"/>
      <stop offset="45%" stop-color="#4834d4"/>
      <stop offset="100%" stop-color="#00cec9"/>
    </linearGradient>
    <linearGradient id="zenithGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="50%" stop-color="#fdcb6e"/>
      <stop offset="100%" stop-color="#e17055"/>
    </linearGradient>
    <linearGradient id="zenithWingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dff9fb"/>
    </linearGradient>
    <filter id="zenithGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield Container -->
  <rect width="128" height="128" rx="30" fill="url(#zenithBgGrad)"/>
  <rect x="2" y="2" width="124" height="124" rx="28" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>

  <!-- Subtle Radial Inner Glow Accent -->
  <circle cx="64" cy="42" r="38" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Peak Zenith Achievement Star (Top Apex) -->
  <path d="M64 16 L67.5 25.5 L77 28.5 L67.5 32 L64 41.5 L60.5 32 L51 28.5 L60.5 25.5 Z" 
        fill="url(#zenithGoldGrad)" filter="url(#zenithGlow)"/>

  <!-- Open Book Wings of Knowledge (Foundation) -->
  <path d="M64 78 C52 70 34 71 22 76 C20 77 19 79 19 81 L19 98 C31 93 49 92 64 99 C79 92 97 93 109 98 L109 81 C109 79 108 77 106 76 C94 71 76 70 64 78 Z" 
        fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.35)" stroke-width="1.8"/>

  <!-- Dynamic Geometric Zenith 'Z' Symbol Interlocking with Book -->
  <path d="M38 42 L88 42 C91 42 93 44.5 91.5 47.5 L53 88 L90 88 C92 88 94 90 94 92 C94 94 92 96 90 96 L38 96 C35 96 33 93.5 34.5 90.5 L73 50 L40 50 C38 50 36 48 36 46 C36 44 38 42 40 42 Z" 
        fill="url(#zenithWingGrad)" filter="url(#zenithGlow)"/>

  <!-- Precision Center Spine / Compass Ray -->
  <line x1="64" y1="44" x2="64" y2="98" stroke="url(#zenithGoldGrad)" stroke-width="2.5" stroke-linecap="round"/>
</svg>